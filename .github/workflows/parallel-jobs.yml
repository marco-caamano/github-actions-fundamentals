name: Parallel Jobs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  job-1:
    runs-on: ubuntu-latest
    
    steps:
      - name: Job 1 - Step 1
        run: |
          echo "Job 1 starting..."
          sleep 5
          echo "Job 1 completed"
  
  job-2:
    runs-on: ubuntu-latest
    
    steps:
      - name: Job 2 - Step 1
        run: |
          echo "Job 2 starting..."
          sleep 5
          echo "Job 2 completed"
  
  job-3:
    runs-on: ubuntu-latest
    
    steps:
      - name: Job 3 - Step 1
        run: |
          echo "Job 3 starting..."
          sleep 5
          echo "Job 3 completed"
